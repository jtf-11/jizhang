name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            libltdl-dev libjpeg-dev libpng-dev \
            libfreetype6-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade "pip<24.1" "setuptools<70" wheel
          python -m pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Build with Buildozer
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export GIT_TERMINAL_PROMPT=0
          export GIT_HTTP_LOW_SPEED_LIMIT=1000
          export GIT_HTTP_LOW_SPEED_TIME=30

          # 后台监控：p4a 目录一出现就删除 libthorvg recipe，绕过其 IndexError bug
          (
            for i in $(seq 1 900); do
              P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"
              if [ -d "$P4A_DIR/pythonforandroid/recipes/libthorvg" ]; then
                rm -rf "$P4A_DIR/pythonforandroid/recipes/libthorvg"
                echo ">>> 已删除 libthorvg recipe"
                break
              fi
              sleep 1
            done
          ) &

          buildozer android debug 2>&1 | tee buildozer.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jizhang-apk
          path: bin/*.apk
          if-no-files-found: error
